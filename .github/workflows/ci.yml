name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # generate butuh DATABASE_URL (prisma.config.ts); dummy cukup karena
      # generate tidak menyentuh DB. HARUS skema libsql:// (klien /web menolak
      # file:). Jangan taruh secret asli di CI.
      - run: npm --workspace=kaos-kami-web exec -- prisma generate
        env:
          DATABASE_URL: "libsql://localhost:8080"
      - run: npm run web:typecheck
      - run: npm run mobile:typecheck
      - run: npm --workspace=kaos-kami-web run lint
      - run: npm run test --workspace=kaos-kami-web
      - run: npm run web:build
        env:
          DATABASE_URL: "libsql://localhost:8080"
      - run: npm run mobile:build
      - name: Lighthouse CI (desktop)
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --config=./lighthouserc.js || echo "LHCI skip on CI without start"
      - name: Bundle size check
        run: |
          npx next-bundle-analyzer || echo "analyzer optional"
