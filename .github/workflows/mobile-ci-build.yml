name: Kaos Kami Mobile - Android CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'kaos-kami-mobile/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Sync 3D Models & Assets
        run: npm run sync:assets

      - name: Build Next.js Mobile Static Export
        run: npm run mobile:build

      - name: Sync Capacitor Android
        run: npm run mobile:sync

      - name: Make Gradle Executable
        run: chmod +x kaos-kami-mobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd kaos-kami-mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaos-kami-release-apk
          path: kaos-kami-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
