name: Kaos Kami Mobile - Android CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'kaos-kami-mobile/**'
      - 'scripts/**'
      - '.github/workflows/mobile-ci-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      KAOSKAMI_STORE_PASSWORD: ${{ secrets.KAOSKAMI_STORE_PASSWORD }}
      KAOSKAMI_KEY_ALIAS: ${{ secrets.KAOSKAMI_KEY_ALIAS }}
      KAOSKAMI_KEY_PASSWORD: ${{ secrets.KAOSKAMI_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Sync 3D Models & Assets
        run: npm run sync:assets

      - name: Build Next.js Mobile Static Export
        run: npm run mobile:build

      - name: Sync Capacitor Android
        run: npm run mobile:sync

      - name: Make Gradle Executable
        run: chmod +x kaos-kami-mobile/android/gradlew

      - name: Restore Release Keystore (beta sideload)
        env:
          KEYSTORE_BASE64: ${{ secrets.KAOSKAMI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KAOSKAMI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAOSKAMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAOSKAMI_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > kaos-kami-mobile/android/app/kaoskami-release.keystore
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > kaos-kami-mobile/android/key.properties

      - name: Build Android Release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd kaos-kami-mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaos-kami-release-apk
          path: kaos-kami-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Build Android Release AAB (Play Store)
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd kaos-kami-mobile/android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaos-kami-release-aab
          path: kaos-kami-mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
